<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Belobra Respawn List</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg-page:#0b0d12;
    --bg-nav:#0e1016;
    --bg-card:#12151c;
    --border:#232733;
    --border-livre:#2fbf87;
    --border-ocupado:#e2574c;
    --text-primary:#eef0f5;
    --text-secondary:#8b8f9c;
    --text-muted:#5c606c;
    --accent-gold:#e0a94a;
    --accent-teal:#2fbf87;
    --accent-red:#e2574c;
    --pill-bg:#1b1e27;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    min-height:100vh;
  }
  header{
    background:var(--bg-nav);
    border-bottom:2px solid;
    border-image:linear-gradient(90deg,var(--accent-gold),var(--accent-teal)) 1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 32px;
    flex-wrap:wrap;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .logo{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:20px;letter-spacing:0.5px;}
  .logo .brand{color:var(--accent-gold);}
  .logo .sub{color:var(--text-secondary);font-weight:400;font-size:14px;letter-spacing:2px;}
  nav{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
  nav a{
    color:var(--text-secondary);
    text-decoration:none;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  nav a:hover{color:var(--text-primary);}
  nav a.current{color:var(--accent-gold);}
  .support{
    background:linear-gradient(90deg,var(--accent-gold),var(--accent-teal));
    color:#0b0d12;
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
  }
  .user{display:flex;align-items:center;gap:8px;font-size:14px;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-teal);}

  main{max-width:1200px;margin:0 auto;padding:32px 24px 80px;}
  .page-title{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .page-title h1{font-size:28px;letter-spacing:1px;}
  .page-title .icon{color:var(--accent-gold);font-size:26px;}
  .counts{display:flex;gap:20px;font-size:13px;color:var(--text-secondary);margin-bottom:24px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .dot.livre{background:var(--accent-teal);}
  .dot.ocupado{background:var(--accent-red);}

  .my-status{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:linear-gradient(135deg, rgba(224,169,74,0.1), rgba(47,191,135,0.06));
    border:1px solid rgba(224,169,74,0.35);
    border-radius:14px;
    padding:16px 20px;
    margin-bottom:24px;
  }
  .my-status.urgent{
    background:linear-gradient(135deg, rgba(226,87,76,0.15), rgba(226,87,76,0.06));
    border-color:rgba(226,87,76,0.6);
    animation:pulse-urgent 1.4s infinite;
  }
  @keyframes pulse-urgent{0%,100%{box-shadow:0 0 0 rgba(226,87,76,0);}50%{box-shadow:0 0 16px rgba(226,87,76,0.4);}}
  .my-status .left{display:flex;align-items:center;gap:14px;}
  .my-status .ico{font-size:22px;}
  .my-status .info b{color:var(--accent-gold);}
  .my-status .info .sub{font-size:12px;color:var(--text-secondary);margin-top:2px;}
  .my-status .timer{
    font-family:'Consolas',monospace;font-weight:700;color:var(--accent-teal);
    background:var(--pill-bg);padding:5px 12px;border-radius:8px;font-size:13px;margin-left:8px;
  }
  .my-status .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .my-status button, .my-status a{
    font-size:12px;font-weight:700;padding:9px 16px;border-radius:20px;cursor:pointer;text-decoration:none;
  }
  .my-status .btn-view{background:var(--pill-bg);border:1px solid var(--border);color:var(--text-primary);}
  .my-status .btn-leave{background:none;border:1px solid rgba(226,87,76,0.4);color:var(--accent-red);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;}
  .controls button, .controls input, .controls select{
    background:var(--pill-bg);
    border:1px solid var(--border);
    color:var(--text-primary);
    border-radius:8px;
    padding:10px 16px;
    font-size:13px;
  }
  .controls input{width:220px;}
  .controls button{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;}
  .controls button:hover{border-color:var(--text-secondary);}
  .controls button.active{border-color:var(--accent-gold);color:var(--accent-gold);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
  }
  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-left:4px solid var(--border-livre);
    border-radius:10px;
    padding:20px;
    display:flex;
    flex-direction:column;
    min-height:230px;
  }
  .card.ocupado{border-left-color:var(--border-ocupado);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:8px;}
  .card-head h3{font-size:17px;line-height:1.3;font-weight:700;}
  .status{font-size:11px;font-weight:700;letter-spacing:0.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;margin-top:4px;}
  .status.ocupado{color:var(--accent-red);}
  .status.livre{color:var(--accent-teal);}

  .maker-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text-primary);}
  .maker-row .swords{color:var(--text-secondary);}

  .timer{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(226,87,76,0.12);
    color:var(--accent-red);
    border:1px solid rgba(226,87,76,0.3);
    border-radius:8px;
    padding:6px 12px;
    font-size:14px;
    font-weight:700;
    font-family:'Consolas',monospace;
    margin-bottom:16px;
    width:fit-content;
  }

  .hunter-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:14px;flex-wrap:wrap;}
  .report-link{
    margin-left:auto;font-size:11px;font-weight:700;color:var(--accent-red);text-decoration:none;
    border:1px solid rgba(226,87,76,0.35);padding:3px 9px;border-radius:20px;
  }
  .report-link:hover{background:rgba(226,87,76,0.1);}
  .report-link.disabled{color:var(--text-muted);border-color:var(--border);cursor:not-allowed;opacity:0.6;}
  .hunter-ico{color:var(--accent-red);font-size:14px;}
  .hunter-tag{font-size:10px;font-weight:400;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-left:2px;}

  .queue-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
  .queue-bar{height:5px;border-radius:4px;background:var(--border);overflow:hidden;margin-bottom:auto;}
  .queue-fill{height:100%;background:linear-gradient(90deg,var(--accent-gold),var(--accent-teal));}

  .card-footer{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--pill-bg);
    color:var(--text-secondary);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .icon-btn.active{border-color:var(--accent-gold);color:var(--accent-gold);}
  .btn-secondary{
    flex:1;
    background:var(--pill-bg);
    border:1px solid var(--border);
    color:var(--text-primary);
    border-radius:20px;
    padding:10px 14px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;
  }
  .btn-primary{
    flex:1.4;
    background:linear-gradient(90deg,var(--accent-gold),var(--accent-teal));
    color:#0b0d12;
    border:none;
    border-radius:20px;
    padding:10px 14px;
    font-size:12px;
    font-weight:800;
    letter-spacing:0.3px;
    cursor:pointer;
    text-decoration:none;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-primary:hover, .btn-secondary:hover{opacity:0.9;}
  .no-results{grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:14px;padding:40px;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--bg-card);border:1px solid var(--border);border-radius:14px;
    padding:26px;width:100%;max-width:360px;
  }
  .modal-box h3{font-size:16px;margin-bottom:12px;}
  .confirm-modal-msg{font-size:14px;color:var(--text-secondary);line-height:1.6;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;border:none;}
  .modal-actions .confirm{background:linear-gradient(90deg,var(--accent-red),var(--accent-gold));color:#0b0d12;}
  .modal-actions .cancel{background:var(--pill-bg);color:var(--text-primary);border:1px solid var(--border);}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="brand">BELOBRA</span><span class="sub">RESPAWN LIST</span></div>
  <nav>
    <a href="belobra-respawn-list.html" class="current">Respawns</a>
    <a href="belobra-regras.html">Regras</a>
    <a href="belobra-guias.html">Guias</a>
    <a href="belobra-estatisticas.html">Estatísticas</a>
    <a href="https://discord.gg/EWehENtQxP" target="_blank" rel="noopener">Discord</a>
    <a href="belobra-apoie.html" class="support">Apoie o Projeto</a>
  </nav>
  <div class="user" id="belobra-user-widget" style="position:relative;"></div>
</header>

<main>
  <div id="my-status-banner"></div>

  <div class="toolbar">
    <div class="left">
      <div class="page-title"><h1>RESPAWN LIST</h1></div>
      <div class="counts">
        <span><span class="dot livre"></span><span id="count-livre">0</span> locais livres</span>
        <span><span class="dot ocupado"></span><span id="count-ocupado">0</span> ocupados</span>
      </div>
    </div>
    <div class="controls">
      <button id="fav-toggle">Favoritos</button>
      <input id="search" placeholder="Buscar por hunt ou cidade...">
      <select id="sort">
        <option value="padrao">Ordenacao: Padrao</option>
        <option value="az">Nome A-Z</option>
        <option value="livres">Livres primeiro</option>
        <option value="ocupados">Ocupados primeiro</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <h3 id="confirm-modal-title">Confirmar acao</h3>
    <p id="confirm-modal-msg" class="confirm-modal-msg"></p>
    <div class="modal-actions">
      <button class="cancel" onclick="closeConfirmModal(false)">Cancelar</button>
      <button class="confirm" id="confirm-modal-btn" onclick="closeConfirmModal(true)">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="belobra-app.js"></script>
<script>
let state = [];
let showFavOnly = false;
let searchTerm = "";
let sortMode = "padrao";
let favorites = JSON.parse(localStorage.getItem('belobra_favorites') || '[]');

async function boot(){
  const respawns = await belobraGetRespawns();
  state = respawns.map(r => ({ id: r.id, name: r.name, favorite: favorites.includes(r.id) }));
  await render();
  await renderMyStatus();
  setInterval(render, 5000);
  setInterval(renderMyStatus, 3000);
}

async function renderMyStatus(){
  const banner = document.getElementById('my-status-banner');
  const entry = await belobraGetMyActiveEntry();

  if(!entry){
    banner.innerHTML = '';
    return;
  }

  const now = Date.now();
  let statusText = '';
  let timerHtml = '';
  let actionBtn = '';
  let isUrgent = false;

  if(entry.status === 'active' && entry.afkChallengeDeadline){
    isUrgent = true;
    const remain = Math.max(0, entry.afkChallengeDeadline - now);
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    statusText = '&#128276; Voce foi reportado como AFK! Confirme sua presenca';
    timerHtml = `<span class="timer" style="color:var(--accent-red);">&#9201; ${m}m ${String(s).padStart(2,'0')}s restantes</span>`;
    actionBtn = `<button class="btn-leave" style="background:var(--accent-red);color:#fff;" onclick="quickConfirmPresence(${entry.id})">Confirmar presenca</button>`;
  } else if(entry.status === 'active'){
    const effectiveMinutes = entry.claimReducedDuration ? entry.durationMin : entry.durationMin + 15;
    const endsAt = entry.startedAt + effectiveMinutes * 60000;
    const remain = Math.max(0, endsAt - now);
    const m = Math.floor(remain / 60000);
    const h = Math.floor(m / 60);
    statusText = 'Voce esta caçando';
    timerHtml = `<span class="timer">&#9201; ${h}h ${m % 60}m restantes</span>`;
    actionBtn = `<button class="btn-leave" onclick="quickEndHunt(${entry.id})">Encerrar Hunt</button>`;
  } else if(entry.status === 'calling'){
    const remain = Math.max(0, entry.callDeadline - now);
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    statusText = 'E a sua vez! Confirme a presenca';
    timerHtml = `<span class="timer">&#9201; ${m}m ${String(s).padStart(2,'0')}s pra confirmar</span>`;
    actionBtn = `<a class="btn-view" href="belobra-respawn-detail.html?id=${entry.respawnId}">Confirmar agora &#8594;</a>`;
  } else {
    statusText = 'Voce esta na fila de espera';
    actionBtn = `<button class="btn-leave" onclick="quickLeaveQueue(${entry.id})">Sair da fila</button>`;
  }

  banner.innerHTML = `
    <div class="my-status ${isUrgent ? 'urgent' : ''}">
      <div class="left">
        <span class="ico">${isUrgent ? '&#128276;' : (entry.status === 'active' ? '&#9876;&#65039;' : (entry.status === 'calling' ? '&#128276;' : '&#9203;'))}</span>
        <div class="info">
          <div>${statusText} em <b>${entry.respawnName}</b> ${timerHtml}</div>
          <div class="sub">${entry.characterName} (${entry.characterType === 'service' ? 'Service' : (entry.characterType === 'maker' ? 'Maker' : 'Principal')})</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn-view" href="belobra-respawn-detail.html?id=${entry.respawnId}">Ver fila &#8594;</a>
        ${actionBtn}
      </div>
    </div>
  `;
}

let confirmModalResolve = null;

function askConfirm(message){
  return new Promise(resolve => {
    confirmModalResolve = resolve;
    document.getElementById('confirm-modal-msg').textContent = message;
    document.getElementById('confirm-modal').classList.add('show');
  });
}

function closeConfirmModal(result){
  document.getElementById('confirm-modal').classList.remove('show');
  if(confirmModalResolve){
    confirmModalResolve(result);
    confirmModalResolve = null;
  }
}

async function quickEndHunt(entryId){
  const ok = await askConfirm('Tem certeza que quer encerrar sua hunt agora? Isso libera o respawn para o proximo da fila.');
  if(!ok) return;
  await belobraEndHunt(entryId);
  await renderMyStatus();
  await render();
}

async function quickConfirmPresence(entryId){
  try{
    await belobraConfirmAfkPresence(entryId);
    await renderMyStatus();
  }catch(e){
    alert(e.message);
  }
}

async function quickLeaveQueue(entryId){
  const ok = await askConfirm('Tem certeza que quer sair dessa fila? Voce vai precisar entrar de novo se mudar de ideia.');
  if(!ok) return;
  await belobraLeaveQueueEntry(entryId);
  await renderMyStatus();
  await render();
}

async function render(){
  const grid = document.getElementById("grid");
  const queueMap = await belobraLoadAllQueueStatus();
  const myWaitingRespawnIds = await belobraGetMyWaitingRespawnIds();

  let items = state.filter(r => {
    if(showFavOnly && !r.favorite) return false;
    if(searchTerm && !r.name.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    return true;
  }).map(r => {
    const q = queueMap[r.id] || { active:false, calling:false, waitingCount:0, activeName:null, activeType:null, activeCharacterId:null, huntEndsAt:null };
    const ocupado = q.active || q.calling;
    const queueCount = q.waitingCount + (q.calling ? 1 : 0);
    return { ...r, ocupado, queue: queueCount, activeName: q.activeName, activeType: q.activeType, activeCharacterId: q.activeCharacterId, huntEndsAt: q.huntEndsAt, iAmWaitingHere: myWaitingRespawnIds.includes(r.id) };
  });

  if(sortMode === "az"){
    items = items.slice().sort((a,b) => a.name.localeCompare(b.name));
  } else if(sortMode === "livres"){
    items = items.slice().sort((a,b) => (a.ocupado?1:0) - (b.ocupado?1:0));
  } else if(sortMode === "ocupados"){
    items = items.slice().sort((a,b) => (a.ocupado?0:1) - (b.ocupado?0:1));
  }

  if(items.length === 0){
    grid.innerHTML = '<div class="no-results">Nenhum respawn encontrado.</div>';
  } else {
    grid.innerHTML = items.map(r => {
      const isOcupadoR = r.ocupado;
      const pct = Math.min(100, (r.queue/10)*100);
      const reportLink = r.iAmWaitingHere
        ? `<a class="report-link" href="belobra-suporte.html?report_char=${r.activeCharacterId}&report_char_name=${encodeURIComponent(r.activeName)}&report_respawn=${encodeURIComponent(r.name)}&report_respawn_id=${r.id}" title="Denunciar este jogador">&#128683; Denunciar</a>`
        : `<span class="report-link disabled" title="Voce precisa estar na fila desse respawn pra denunciar">&#128683; Denunciar</span>`;
      const hunterRow = r.activeName ? `
          <div class="hunter-row">
            <span class="hunter-ico">&#9876;&#65039;</span>
            <span class="hunter-name">${r.activeName}</span>
            <span class="hunter-tag">${r.activeType === 'service' ? 'SERVICE' : (r.activeType === 'maker' ? 'MAKER' : 'PRINCIPAL')}</span>
            ${reportLink}
          </div>` : '';
      return `
        <div class="card ${isOcupadoR ? 'ocupado' : ''}">
          <div class="card-head">
            <h3>${r.name}</h3>
            <span class="status ${isOcupadoR?'ocupado':'livre'}">&#9679; ${isOcupadoR?'OCUPADO':'LIVRE'}</span>
          </div>
          ${hunterRow}
          <div class="queue-label"><span>${r.queue} na fila de espera</span><span>maximo 10</span></div>
          <div class="queue-bar"><div class="queue-fill" style="width:${pct}%"></div></div>
          <div class="card-footer">
            <div class="icon-btn ${r.favorite?'active':''}" onclick="toggleFav(${r.id})">&#9733;</div>
            <a class="btn-secondary" href="belobra-respawn-detail.html?id=${r.id}">Ver fila</a>
            <a class="btn-primary" href="belobra-respawn-detail.html?id=${r.id}&join=1">${isOcupadoR ? 'Reservar vaga' : 'Entrar na fila'}</a>
          </div>
        </div>`;
    }).join("");
  }

  const totalOcupados = state.filter(r => {
    const q = queueMap[r.id];
    return q && (q.active || q.calling);
  }).length;
  const livres = state.length - totalOcupados;
  document.getElementById("count-livre").textContent = livres;
  document.getElementById("count-ocupado").textContent = totalOcupados;
}

function toggleFav(id){
  const r = state.find(x => x.id === id);
  r.favorite = !r.favorite;
  if(r.favorite){
    if(!favorites.includes(id)) favorites.push(id);
  } else {
    favorites = favorites.filter(f => f !== id);
  }
  localStorage.setItem('belobra_favorites', JSON.stringify(favorites));
  render();
}

document.getElementById("fav-toggle").addEventListener("click", () => {
  showFavOnly = !showFavOnly;
  document.getElementById("fav-toggle").classList.toggle("active", showFavOnly);
  render();
});

document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  render();
});

document.getElementById("sort").addEventListener("change", (e) => {
  sortMode = e.target.value;
  render();
});

boot();
</script>

</body>
</html>
