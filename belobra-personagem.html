<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Belobra Respawn List - Trocar Personagem</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg-page:#0b0d12; --bg-nav:#0e1016; --bg-card:#12151c; --border:#232733;
    --text-primary:#eef0f5; --text-secondary:#8b8f9c; --text-muted:#5c606c;
    --accent-gold:#e0a94a; --accent-teal:#2fbf87; --accent-red:#e2574c; --pill-bg:#1b1e27;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg-page);color:var(--text-primary);font-family:'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;}
  header{
    background:var(--bg-nav);border-bottom:2px solid;
    border-image:linear-gradient(90deg,var(--accent-gold),var(--accent-teal)) 1;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10;
  }
  .logo{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:20px;}
  .logo .brand{color:var(--accent-gold);}
  .logo .sub{color:var(--text-secondary);font-weight:400;font-size:14px;letter-spacing:2px;}
  nav{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
  nav a{color:var(--text-secondary);text-decoration:none;font-size:14px;}
  nav a:hover{color:var(--text-primary);}
  .support{background:linear-gradient(90deg,var(--accent-gold),var(--accent-teal));color:#0b0d12;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-teal);}

  main{max-width:560px;margin:0 auto;padding:60px 24px 100px;}

  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:36px;text-align:center;}
  .card h1{font-size:24px;margin-bottom:10px;}
  .card h1 .accent{color:var(--accent-teal);}
  .card .sub{color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:28px;}

  .tabs{display:flex;background:var(--pill-bg);border-radius:12px;padding:5px;margin-bottom:24px;}
  .tabs button{
    flex:1;background:none;border:none;color:var(--text-secondary);
    padding:10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tabs button.active{background:linear-gradient(90deg,var(--accent-teal),#8b7ee0);color:#0b0d12;}

  .field-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);letter-spacing:0.5px;margin-bottom:8px;text-align:left;}
  .verified-badge{color:var(--accent-teal);font-weight:700;font-size:11px;}
  .input-row{position:relative;margin-bottom:20px;}
  .input-row input{
    width:100%;background:var(--pill-bg);border:1px solid var(--border);
    color:var(--text-primary);padding:14px 16px;border-radius:10px;font-size:14px;
  }
  .input-row input:disabled{opacity:0.7;}
  .char-count{position:absolute;right:12px;top:14px;font-size:11px;color:var(--text-muted);}

  .btn-main{
    width:100%;background:linear-gradient(90deg,var(--accent-gold),var(--accent-teal));
    color:#0b0d12;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;
  }
  .btn-main:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-secondary{
    width:100%;background:var(--pill-bg);border:1px solid var(--border);
    color:var(--text-primary);padding:12px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;margin-top:10px;
  }

  .code-box{
    background:var(--pill-bg);border:1px dashed var(--accent-gold);border-radius:12px;
    padding:18px;margin:18px 0;text-align:left;
  }
  .code-box .code{font-family:'Consolas',monospace;font-size:18px;font-weight:700;color:var(--accent-gold);letter-spacing:2px;margin:8px 0;word-break:break-all;}
  .code-box p{font-size:12px;color:var(--text-secondary);line-height:1.6;}
  .code-box a{color:var(--accent-teal);}

  .warn-note{
    background:rgba(226,87,76,0.08);border:1px solid rgba(226,87,76,0.3);border-radius:10px;
    padding:14px 16px;font-size:12px;color:var(--text-secondary);line-height:1.6;text-align:left;margin-bottom:16px;
  }
  .warn-note b{color:var(--accent-red);}

  .status-msg{font-size:13px;margin-top:14px;min-height:18px;}
  .status-msg.ok{color:var(--accent-teal);}
  .status-msg.fail{color:var(--accent-red);}

  .verified-check{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent-teal);font-weight:700;font-size:14px;background:rgba(47,191,135,0.1);border:1px solid rgba(47,191,135,0.3);border-radius:10px;padding:14px;margin-bottom:16px;}
  .login-wall{text-align:center;padding:40px;color:var(--text-secondary);font-size:14px;}
  .login-wall button{margin-top:16px;background:#5865F2;color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="brand">BELOBRA</span><span class="sub">RESPAWN LIST</span></div>
  <nav>
    <a href="belobra-respawn-list.html">Respawns</a>
    <a href="belobra-regras.html">Regras</a>
    <a href="belobra-guias.html">Guias</a>
    <a href="belobra-estatisticas.html">Estatisticas</a>
    <a href="https://discord.gg/EWehENtQxP" target="_blank" rel="noopener">Discord</a>
    <a href="belobra-apoie.html" class="support">Apoie o Projeto</a>
  </nav>
  <div class="user" id="belobra-user-widget" style="position:relative;"></div>
</header>

<main>
  <div id="app-area"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="belobra-app.js"></script>
<script>
let currentType = 'main';
let servicePermissions = [];
let serviceInvite = null;
let currentUserId = null;
let myCharacters = [];

async function boot(){
  const user = await belobraGetUser();
  const area = document.getElementById('app-area');

  currentUserId = user ? user.id : null;
  if(!user){
    area.innerHTML = `
      <div class="card">
        <div class="login-wall">
          Voce precisa estar logado com o Discord pra cadastrar um personagem.
          <br>
          <button onclick="belobraSignInDiscord()">Entrar com Discord</button>
        </div>
      </div>`;
    return;
  }

  myCharacters = await belobraGetMyCharacters();
  try { servicePermissions = await belobraGetMyServicePermissions(); } catch(e) { servicePermissions = []; }
  renderCard();
}

function getChar(type){
  return myCharacters.find(c => c.type === type) || null;
}

function renderCard(){
  const area = document.getElementById('app-area');
  const char = getChar(currentType);
  if(currentType === 'service'){ renderServiceCard(); return; }

  area.innerHTML = `
    <div class="card">
      <h1>Trocar seu <span class="accent">Personagem</span></h1>
      <div class="sub">Insira o nome exatamente como esta no Tibia. Nomes duplicados ou invalidos vao exigir nova verificacao.</div>

      <div class="tabs">
        <button class="${currentType==='main'?'active':''}" onclick="switchTab('main')">&#128100; Principal</button>
        <button class="${currentType==='maker'?'active':''}" onclick="switchTab('maker')">&#128295; Maker</button>
        <button class="${currentType==='service'?'active':''}" onclick="switchTab('service')">&#128279; Service</button>
      </div>

      <div class="field-label">
        <span>NOME DO PERSONAGEM ${currentType==='main'?'PRINCIPAL':'MAKER'}</span>
        ${char && char.verified ? '<span class="verified-badge">&#10003; VERIFICADO</span>' : ''}
      </div>

      <div class="input-row">
        <input type="text" id="char-name-input" maxlength="30" placeholder="Ex: Monks Lord" value="${char ? char.name : ''}" oninput="updateCount()">
        <span class="char-count" id="char-count">${char ? char.name.length : 0}/30</span>
      </div>

      ${char && !char.verified ? `
        <div class="code-box">
          <p>Cole este codigo no campo <b>Comment</b> do seu personagem em tibia.com/community, depois clique em Verificar:</p>
          <div class="code">${char.verification_code}</div>
          <p><a href="https://www.tibia.com/community/?subtopic=characters" target="_blank">Abrir tibia.com em outra aba &#8594;</a></p>
        </div>
        <div class="warn-note">&#9888;&#65039; Fique <b>deslogado do jogo</b> por alguns minutos antes de clicar em Verificar. Enquanto o personagem esta online, o tibia.com nao atualiza as informacoes publicas dele a tempo, e a verificacao pode nao encontrar o codigo mesmo estando certo.</div>
        <button class="btn-main" onclick="doVerify(${char.id})" id="verify-btn">Ja colei o codigo, Verificar agora</button>
        <button class="btn-secondary" onclick="doSave()">Errou o nome? Salvar nome novo e gerar outro codigo</button>
        <div class="status-msg" id="status-msg"></div>
      ` : `
        ${char && char.verified ? '<div class="verified-check">&#10003; Personagem verificado com sucesso</div>' : ''}
        <button class="btn-main" onclick="doSave()">${char ? 'Trocar personagem e gerar novo codigo' : 'Confirmar e Gerar Codigo'}</button>
        <div class="status-msg" id="status-msg"></div>
      `}
    </div>
  `;
}

function switchTab(type){
  currentType = type;
  renderCard();
}

function renderServiceCard(){
  const area = document.getElementById('app-area');
  const owned = myCharacters.filter(c => c.verified && ['main','maker'].includes(c.type));
  const incoming = servicePermissions.filter(p => p.grantee_profile_id);
  const outgoing = servicePermissions.filter(p => p.owner_profile_id);
  area.innerHTML = `
    <div class="card">
      <h1>Autorizações de <span class="accent">Service</span></h1>
      <div class="sub">Um Service só pode usar seu personagem depois que você gerar um convite e a outra conta aceitar o código logada no próprio Discord. Nunca autorize alguém apenas por nome.</div>

      <div class="code-box" style="border-style:solid;border-color:rgba(47,191,135,0.35);">
        <p><b>Você vai fazer Service para alguém?</b><br>Escolha um personagem verificado e gere um convite de uso. O código é temporário e pode ser revogado.</p>
        <select id="service-owner-char" style="width:100%;background:var(--pill-bg);border:1px solid var(--border);color:var(--text-primary);padding:12px;border-radius:8px;margin-top:12px;">
          <option value="">Selecione seu personagem</option>
          ${owned.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${c.type === 'maker' ? 'Maker' : 'Principal'})</option>`).join('')}
        </select>
        <button class="btn-main" style="margin-top:12px;" onclick="createServiceInvite()">Gerar convite de Service</button>
        ${serviceInvite ? `<div class="code" style="margin-top:14px;">${escapeHtml(serviceInvite.invite_code || '')}</div><p>Envie este código para a pessoa. Ela deve entrar no site com o Discord dela e aceitar na aba Service. Validade: 7 dias.</p>` : ''}
      </div>

      <div class="code-box">
        <p><b>Você recebeu um convite?</b><br>Cole o código enviado pelo dono do personagem. Ele será vinculado à sua conta Discord atual.</p>
        <input id="service-invite-code" type="text" maxlength="10" placeholder="Ex: A1B2C3D4E5" style="width:100%;background:var(--pill-bg);border:1px solid var(--border);color:var(--text-primary);padding:12px;border-radius:8px;margin-top:12px;text-transform:uppercase;">
        <button class="btn-main" style="margin-top:12px;" onclick="acceptServiceInvite()">Aceitar convite</button>
      </div>

      <div style="text-align:left;margin-top:18px;">
        <h3 style="font-size:15px;margin-bottom:10px;">Autorizações da minha conta</h3>
        ${servicePermissions.length ? servicePermissions.map(p => {
          const isOwner = p.owner_profile_id === currentUserId;
          const status = p.status === 'active' ? 'Ativo' : (p.status === 'pending' ? 'Aguardando aceite' : p.status === 'revoked' ? 'Revogado' : 'Expirado');
          return `<div style="background:var(--pill-bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px;font-size:12px;">
            <b>${escapeHtml(p.character_name || '')}</b> — ${isOwner ? 'convite criado' : 'Service autorizado'}<br>
            <span style="color:var(--text-secondary);">${status}${p.invite_code ? ' · código ' + escapeHtml(p.invite_code) : ''}</span>
            ${(p.status === 'active' || p.status === 'pending') ? `<button class="btn-secondary" style="margin-top:8px;" onclick="revokeService('${p.permission_id}')">Revogar autorização</button>` : ''}
          </div>`;
        }).join('') : '<p style="color:var(--text-secondary);font-size:13px;">Nenhuma autorização Service registrada.</p>'}
      </div>
      <div class="status-msg" id="service-status"></div>
    </div>`;
}

function escapeHtml(value){
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

async function createServiceInvite(){
  const msg = document.getElementById('service-status');
  const id = document.getElementById('service-owner-char').value;
  if(!id){ msg.textContent = 'Selecione um personagem verificado.'; msg.className = 'status-msg fail'; return; }
  try{
    serviceInvite = await belobraCreateServiceInvite(id);
    servicePermissions = await belobraGetMyServicePermissions();
    renderServiceCard();
    document.getElementById('service-status').textContent = 'Convite criado. Envie o código para a pessoa autorizada.';
    document.getElementById('service-status').className = 'status-msg ok';
  }catch(e){ msg.textContent = 'Não foi possível criar o convite: ' + e.message; msg.className = 'status-msg fail'; }
}

async function acceptServiceInvite(){
  const msg = document.getElementById('service-status');
  const input = document.getElementById('service-invite-code');
  const code = (input.value || '').trim().toUpperCase();
  if(!code){ msg.textContent = 'Cole o código do convite.'; msg.className = 'status-msg fail'; return; }
  try{
    await belobraAcceptServiceInvite(code);
    servicePermissions = await belobraGetMyServicePermissions();
    renderServiceCard();
    document.getElementById('service-status').textContent = 'Convite aceito. O personagem aparecerá como Service ao entrar em uma hunt.';
    document.getElementById('service-status').className = 'status-msg ok';
  }catch(e){ msg.textContent = 'Não foi possível aceitar o convite: ' + e.message; msg.className = 'status-msg fail'; }
}

async function revokeService(permissionId){
  if(!confirm('Revogar esta autorização Service? A pessoa não poderá usar o personagem novamente.')) return;
  try{
    await belobraRevokeServicePermission(permissionId);
    servicePermissions = await belobraGetMyServicePermissions();
    renderServiceCard();
  }catch(e){ alert('Não foi possível revogar: ' + e.message); }
}

function updateCount(){
  const val = document.getElementById('char-name-input').value;
  document.getElementById('char-count').textContent = val.length + '/30';
}

async function doSave(){
  const name = document.getElementById('char-name-input').value.trim();
  const msg = document.getElementById('status-msg');
  if(!name){ msg.textContent = 'Digite o nome do personagem.'; msg.className='status-msg fail'; return; }

  try{
    await belobraSaveCharacter(name, currentType);
    myCharacters = await belobraGetMyCharacters();
    renderCard();
  }catch(e){
    msg.textContent = 'Erro ao salvar: ' + e.message;
    msg.className = 'status-msg fail';
  }
}

async function doVerify(characterId){
  const btn = document.getElementById('verify-btn');
  const msg = document.getElementById('status-msg');
  btn.disabled = true;
  btn.textContent = 'Verificando...';
  msg.textContent = '';

  try{
    const result = await belobraVerifyCharacter(characterId);
    if(result.verified){
      myCharacters = await belobraGetMyCharacters();
      renderCard();
    } else {
      msg.textContent = result.message || 'Codigo nao encontrado no comentario ainda. Confira se salvou no tibia.com e tente de novo.';
      msg.className = 'status-msg fail';
      btn.disabled = false;
      btn.textContent = 'Ja colei o codigo, Verificar agora';
    }
  }catch(e){
    msg.textContent = 'Erro ao verificar: ' + e.message;
    msg.className = 'status-msg fail';
    btn.disabled = false;
    btn.textContent = 'Ja colei o codigo, Verificar agora';
  }
}

boot();
</script>

</body>
</html>
